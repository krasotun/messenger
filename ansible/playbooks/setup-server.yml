- name: Configure FastVPS server for Messenger frontend
  hosts: fastvps_managed
  become: true
  gather_facts: true

  vars:
    deploy_user: deploy
    messenger_server_name: s9865e4c2.fastvps-server.com
    messenger_web_root: /var/www/messenger
    runtime_packages:
      - nginx
      - certbot
      - python3-certbot-nginx
      - openssh-server
      - rsync
      - ufw

  handlers:
    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded

  tasks:
    - name: Install runtime and deployment packages
      ansible.builtin.apt:
        name: "{{ runtime_packages }}"
        state: present
        update_cache: true

    - name: Ensure Messenger web root exists
      ansible.builtin.file:
        path: "{{ messenger_web_root }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0755"

    - name: Install Messenger nginx HTTP site
      ansible.builtin.template:
        src: templates/nginx-messenger-http.conf.j2
        dest: /etc/nginx/sites-available/messenger
        owner: root
        group: root
        mode: "0644"
      notify: Reload nginx

    - name: Enable Messenger nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/messenger
        dest: /etc/nginx/sites-enabled/messenger
        state: link
      notify: Reload nginx

    - name: Disable default nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload nginx

    - name: Validate nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Ensure nginx is enabled and running
      ansible.builtin.service:
        name: nginx
        enabled: true
        state: started

    - name: Allow SSH through UFW
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Allow HTTP through UFW
      community.general.ufw:
        rule: allow
        port: "80"
        proto: tcp

    - name: Allow HTTPS through UFW
      community.general.ufw:
        rule: allow
        port: "443"
        proto: tcp

    - name: Enable UFW with default deny incoming
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming

    - name: Set UFW default allow outgoing
      community.general.ufw:
        policy: allow
        direction: outgoing
