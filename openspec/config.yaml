schema: spec-driven

context: |
  Language: russian
  All artifacts must be written in russian.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  ## Продукт

  `messenger` - веб-мессенджер: регистрация и вход, профиль пользователя,
  чаты и обмен сообщениями. Работает поверх учебного API Яндекс.Практикума
  (https://ya-praktikum.tech/api/v2), собственного бэкенда у проекта нет.

  Пользователь один - зарегистрированный человек, который переписывается с
  другими пользователями. Ролей и админки нет.

  Реализовано сейчас: регистрация, вход, восстановление сессии, выход,
  guard-политика доступа к маршрутам, редактирование профиля, смена пароля.
  Чаты реализованы частично: список чатов, создание и удаление чата, состав
  участников, поиск пользователя и добавление участника. Переписки еще нет:
  ни истории сообщений, ни отправки, ни сокета.

  Ограничение: приложение рассчитано на не более чем 10 чатов у пользователя.
  `GET /chats` без параметров отдает первые 10, а чат по ID учебное API не
  отдает вовсе, поэтому выбранный чат ищется в загруженном списке. Постраничную
  загрузку списка и поиск чата перебором страниц не делаем: это обход
  отсутствующего endpoint, а не решение. Факты - в `docs/api/README.md`.

  ## Стек и структура

  Angular 21 (standalone, signals), TypeScript, RxJS, Angular CDK.
  Тесты: Vitest (unit/component), Playwright (e2e, визуальные).
  Мок-бэкенд для локальной разработки и e2e: `mock-backend` на :3000.

  Архитектура - Domain-first Angular, домен разложен на модули-папки
  `data/`, `feature-<x>/`, `ui/`
  (`docs/adr/2026-10-28-page-part-stores-and-folder-boundaries.md`). Переезд
  идет по шагам #275: `chats` уже в этой раскладке, `identity-access` - еще в
  прежней (`docs/adr/2026-10-27-domain-code-grouped-by-feature.md`).

  - `src/app/shared` - UI-примитивы и общие типы, без знания о доменах;
  - `src/app/domains/<context>/` - корень домена: `<context>.providers.ts` и
    публичный API `index.ts`;
  - `src/app/domains/<context>/data/` - модели, порт **Шлюза**, его
    реализация `Http*Gateway`, сервисы и **Сторы** домена; DTO, HTTP API,
    мапперы и тексты ошибок - в `data/internal/`, снаружи модуля недоступны;
  - `src/app/domains/<context>/feature-<x>/` - компоненты части страницы,
    каждый в своей папке; берут из `data/` и `ui/`, но не из другой фичи;
  - `src/app/domains/<context>/ui/` - компоненты без своего состояния, только
    входы и выходы; берут только из `data/`;
  - `src/app/domains/<context>/testing/` - двойники и фикстуры для спеков;
  - `src/app/core` - routing, guards, layouts, tokens, app initializers;
  - `src/app/pages` - страницы-композиции.

  Прежняя раскладка (`identity-access`): модели и порты в корне домена, фича -
  папка с компонентами и сервисами, HTTP - в `api/`; слои - роли файлов по
  суффиксам (`*.service.ts`, `*.state.ts`, `*.gateway.ts`, `*.type.ts`).

  Aliases: `@core/*`, `@domains/*`, `@shared/*`. Границы импортов: между
  модулями-папками - Sheriff (`sheriff.config.ts`, правило ESLint
  `@softarc/sheriff`); `shared` не импортирует домены, core и pages;
  application (`data/`, а в прежней раскладке - файлы с суффиксами) не знает
  про DOM, Overlay, ModalRef и Angular-формы - `no-restricted-imports` в
  `eslint.config.js`.

  ## Глоссарий

  Словарь домена - в `CONTEXT.md` в корне репозитория. Здесь он не дублируется.

  Спеки пишутся по-русски, код - по-английски; соответствие русского термина
  английскому имени в коде задает `CONTEXT.md`, синонимы оттуда же в разделах
  `_Avoid_` использовать нельзя. Состав перечислений и полей моделей смотри в
  коде, а не в словаре.

  Термины OpenSpec: capability - каталог в `openspec/specs/`; change -
  предложенное изменение в `openspec/changes/`; delta - файл спеки внутри
  change; requirement и scenario - заголовки внутри спеки.

  ## Конвенции работы

  - TDD обязателен: сначала тест на поведение из спецификации, затем
    минимальная реализация, затем refactor.
  - Уровень теста по слою: application specs для сценариев и state,
    infrastructure specs для API/мапперов, component specs для UI behavior,
    guard/routing specs для навигации, e2e для сквозных сценариев.
  - Quality gates перед завершением задачи: `npm run lint`, `npm run test:ci`;
    `npm run e2e` - если затронут сквозной пользовательский сценарий.
  - Новый экран, модалка или заметный элемент интерфейса закрывается
    скриншотным e2e-тестом: component specs проверяют поведение, но не то,
    как экран выглядит. Тест кладется рядом с обычным e2e фичи
    (`<feature>.screenshot.spec.ts`) и снимает состояние по умолчанию -
    открытый экран с пустыми полями; состояния с текстом от бэкенда снимать
    не нужно, они ломаются при любой правке сообщения. Правка верстки
    существующего экрана снапшот не добавляет, а обновляет: разошедшийся
    снимок пересматривается глазами, а не переснимается вслепую.
  - Скриншотный e2e-тест помечается тегом `@visual` в имени теста: на этом
    теге стоит разделение прогонов - `npm run e2e` идет с
    `--grep-invert @visual`, `npm run e2e:visual` - с `--grep @visual`. Без
    тега скриншотный тест попадет в обычный прогон и будет там падать.
  - Эталон скриншота один и от платформы не зависит: имя задается
    `snapshotPathTemplate` без сегмента платформы, снимок снимается на linux,
    арбитр - job `visual` в CI. Снимки проверяются только там: локально
    `npm run e2e:visual` не запускается - на macOS рендер расходится с
    linux-эталоном, а контейнер с браузером стоит несколько гигабайт диска.
    Новый или обновленный эталон берется из артефакта `test-results`
    упавшего job `visual` (`*-actual.png`).
  - Сессия хранится бэкендом в cookie; токены не кладутся в localStorage или
    sessionStorage, запросы к API идут с `withCredentials`.
  - До выбора Angular-сущностей ответь: кто вызывает фичу, какие данные
    передает, какой результат получает, кто владеет состоянием, какие ошибки
    возможны, что должно быть протестировано.
  - Ответственности: component отображает UI и локальное взаимодействие;
    service координирует поведение, хранит состояние и скрывает инфраструктуру;
    directive добавляет переиспользуемое DOM-поведение без своего шаблона.
  - Только сигнальный API Angular, декораторы не используем: `input()` и
    `input.required()`, `output()`, `viewChild()` и `viewChildren()`,
    `contentChild()` и `contentChildren()`, `model()`. `@Input`, `@Output`,
    `@ViewChild`, `@ContentChild` в новом коде не появляются.
  - Только Reactive Forms: значение поля живет в `FormControl`, в шаблоне -
    `formControlName` или `[formControl]`. Template-driven формы (`FormsModule`,
    `ngModel`) и разбор значения из нативного `(input)`/`(change)` в новом коде
    не появляются - иначе валидация и состояние поля расползаются по компоненту
    мимо формы. Поле, которое `FormControl` не принимает напрямую (например,
    выбор файла), закрывается своим `ControlValueAccessor` в `shared/ui`, а не
    ручным обработчиком события.
  - Прежде чем ввести конструкцию, которой в `src` еще нет, посмотри, как
    решена та же задача в соседнем коде. Отсутствие прецедента - сигнал, что
    конструкция проекту чужая, а не что ее просто забыли применить.
  - Имя файла отвечает на «что внутри», и суффикс на файле ровно один: два
    суффикса подряд (`sign-in.input.type.ts`) читаются хуже, чем одно составное
    имя. Файл, где нет ничего кроме типов и интерфейсов, - `<имя>.type.ts`, и
    роль в архитектуре уезжает в само имя: `sign-in-input.type.ts`, а не
    `sign-in.input.ts`; `chat-dto.type.ts`, а не `chat.dto.ts`. Файл, где нет
    ничего кроме констант, - `<имя>.constants.ts`: экспортируемая константа не
    живет в файле типа, `DEFAULT_MODAL_SIZE` лежит в `modal-size.constants.ts`,
    а `ModalSize` - в `modal-size.type.ts`. Константа без `export`, нужная
    только внутри файла, остается на месте. Токен живет рядом со своим
    интерфейсом в одном файле (`auth.gateway.ts` держит и `AuthGateway`, и
    `AUTH_GATEWAY`): разрыв здесь ничего не проясняет, а импортов добавляет.
    Все остальное названо по главному идентификатору внутри, без суффикса
    артефакта (`sign-in.service.ts`, `toast.ts`, `user.mapper.ts`) - это
    конвенция Angular style guide 2025, и проект от нее не отступает.
    В доменах, переехавших на `data/`, `feature-<x>/`, `ui/`, суффиксов нет
    совсем: имя файла - это главный идентификатор в kebab-case
    (`chat-list-service.ts` для `ChatListService`, `chat.ts` для `Chat`,
    `chat-gateway.ts` для `ChatGateway` и `CHAT_GATEWAY`); роль файла задает
    папка.
  - Flex-раскладка пишется миксинами `row` и `column` из `src/styles/_layout.scss`,
    а не `display: flex` руками: `@use 'layout'` в начале файла, дальше
    `@include layout.row(12px, $align: center)`. Промежуток, выравнивание и
    распределение передаются аргументами; что не передали - миксин не выводит,
    поэтому `@include layout.row()` дает ровно `display: flex`. Сам `@include`
    идет первым в правиле, а `flex-grow`, `min-width` и `position` остаются под
    ним: они описывают не раскладку детей, а поведение элемента внутри
    родителя. `display: grid` миксинов не имеет и пишется как есть.
  - Спеки компонентов пишутся на Angular Testing Library через точку входа
    `@testing-library/angular/zoneless`, действия пользователя - через
    `@testing-library/user-event`, проверки - матчерами jest-dom (почему - в
    ADR `docs/adr/2026-10-10-component-specs-on-angular-testing-library.md`).
    Элемент ищется так, как его видит пользователь: по роли и имени, подписи
    поля, тексту. По классу - только когда класс сам контракт (модификатор
    цвета или размера, элемент раскладки без роли). `fireEvent` - только там,
    где пользовательского пути нет (submit при выключенной кнопке), с
    комментарием почему.
  - Проверка отсутствия по имени (`queryByRole('button', { name })`) проходит
    впустую, если имя поменялось. Она честная, только если соседний тест
    закрепляет это имя у видимого элемента; иначе ищи без имени.
  - В `zoneless`-render входы и выходы передаются `inputBinding`/
    `outputBinding`; сервис из `providers` компонента подменяется через
    `configureTestBed` и `overrideComponent`; второй `render` в одном тесте
    невозможен - повторное открытие идет через `TestBed.createComponent`.
  - В спеке Стора `describe` называет действие пользователя (`'create chat'`),
    а не метод: тестируем действие, и имя не ломается при переименовании
    метода. Один спек на Стор, `describe` на действие.
  - Дочерний компонент, чьи детали проверяет спек родителя, получает CDK
    component harness в `testing/` своего домена (`ChatUserRowHarness`): спек
    родителя говорит со строкой методами harness и не знает ее разметку.
    Harness на каждый компонент не заводим.
  - Модели и двойники, которые повторяются хотя бы в двух спеках, берутся из
    хранилищ `<Домен>Mocks` в `testing/` домена или примитива (`ChatMocks`,
    `IdentityMocks`, `NotificationMocks`, `ModalMocks`). Каждый вызов отдает
    новый двойник, методы типизированы по порту
    (`vi.fn<ChatGateway['deleteChat']>()`), модель - значения по
    умолчанию плюс переопределения тех полей, которые спек читает. Одноразовые
    двойники и литералы в спеках маппинга остаются в спеке. Импорт `testing/` из прод-кода запрещен ESLint.
  - `data-testid` в прод-разметку не добавляем: он попадает в сборку и дает
    элементу второе имя. Допустим только в тестовых host-компонентах внутри
    spec-файлов.
  - Не смешивай части, которые меняются по разным причинам (UI-инфраструктура,
    требования экрана, бизнес-логика use case).
  - Иди от конкретного к общему: минимальный контракт под текущую задачу,
    обобщение - только после реального повторения.
  - Тестируй поведение, а не факт создания сервиса: действие пользователя,
    видимый результат, изменение состояния, отсутствие изменений при отмене и
    ошибке.
  - Юнит - единица поведения, а не класс (классическая школа). Двойник
    ставится только там, где наш код сообщает что-то за пределы системы, и на
    инфраструктуру, которой тест не управляет: порт (`AUTH_GATEWAY`,
    `CHAT_GATEWAY`, `NOTIFIER`), HTTP, примитивы поверх CDK Overlay
    (`ModalService`, `ConfirmationService`). `Router` не подменяем (гайд
    Angular: «Do not mock Angular Router»): `provideRouter` с заглушкой-страницей
    на нужном пути, проверка - `TestBed.inject(Router).url`, как в
    `sign-in-page.spec.ts`. Наш код, работающий в памяти, остается настоящим
    на любом слое: спек компонента получает настоящий `ChatListStore`, и
    тот ходит в двойник `CHAT_GATEWAY`; спек `HttpAuthGateway` работает с
    настоящими `AuthApi` и мапперами, а HTTP под ними подменяет
    `HttpTestingController`. Исход проверяется по состоянию и возвращенному
    значению; `toHaveBeenCalledWith` - только когда исход виден лишь как вызов
    (ушел запрос, показано уведомление) или когда вызова быть не должно. Спеки с
    двойником на соседа переходят на правило при следующей правке; двойник
    сервиса application уходит из `<Домен>Mocks` вместе с последним спеком,
    который его брал.
  - Не используй JSDoc-теги вроде `@internal` для пометки членов класса как
    деталей реализации: они не проверяются языком и ничего не дают без внешних
    тулов (TypeDoc, API Extractor), которых в проекте нет. Если член нужен
    только внутри модуля - делай его `private`; если он нужен другому классу
    того же примитива (как `closeRequested$` у `ModalRef` для `ModalService`),
    оставляй обычным публичным полем без тега.

rules:
  proposal:
    - Указывай, какие слои затрагивает изменение (domain / application / infrastructure / presentation / core)
    - 'Если у change есть issue на GitHub, указывай его строкой `Issue: #N`'
  specs:
    - Сценарий описывает видимое пользователю поведение; термины бери из `CONTEXT.md`, синонимы из `_Avoid_` не используй
    - Термина нет в `CONTEXT.md`, а правдоподобный синоним у него есть - сначала запиши термин в `CONTEXT.md`, потом в спеку
  design:
    - 'Начинай решения с раздела `## Поток`: схема главного сценария по времени (действие человека → кто кого зовет → исходы) с номером блока tasks у каждой стрелки. Спека и tasks нарезаны по слоям, схема собирает их в одну картинку'
    - Указывай уровень теста для каждого сценария (application / infrastructure / component / guard / e2e)
    - Приводи состав вводимых сущностей - имя, ответственность, слой; конкретные файлы оставляй для tasks
    - 'Для каждого вводимого или меняемого компонента дай секцию `### Контракты компонентов`: таблица входов и выходов с типами в итоговом виде и строка «решает сам»; в каком блоке что появляется - дело tasks, в контракте не дублируем. Решения отвечают на «почему», контракт - на «что получает и отдает»; спек пишется по контракту, не по рассуждениям'
    - 'Решение, прошедшее порог `docs/adr/README.md`, выноси в ADR и ссылайся на него; в design.md его не пересказывай'
  tasks:
    - Каждая задача на новое поведение начинается с шага "написать падающий тест"
    - Называй конкретные файлы, которые создаются или меняются
    - Последним шагом всегда идут quality gates (lint, test:ci, при необходимости e2e)
    - 'Секция `## N. ...` - единица ревью: она ложится одним коммитом в ветку issue. Дели задачи на секции так, чтобы каждая тянула на отдельный коммит'

operations:
  apply:
    guidance:
      - Реализуй по одной секции tasks.md за раз, в конце секции останавливайся и жди апрува
      - 'Закончив секцию: коммит в ветку блока, push и PR `ветка блока -> ветка issue`. Ветка issue кода сама не несет'
      - В отчете по секции перечисляй закрытые задачи, созданные и измененные файлы, результат lint и test:ci
