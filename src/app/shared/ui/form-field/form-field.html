<div class="form-field">
  <!-- eslint-disable-next-line @angular-eslint/template/label-has-associated-control -- the control is projected content, invisible to static analysis -->
  <label class="form-field__label">
    <span class="form-field__label-text">{{ label() }}</span>
    <ng-content></ng-content>
  </label>
  @if (message(); as message) {
  <p-message severity="error" size="small" variant="simple">{{ message }}</p-message>
  }
</div>
