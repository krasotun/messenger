<p class="app-confirmation-dialog__message">{{ data().message }}</p>

<div class="app-confirmation-dialog__actions">
  <button
    type="button"
    class="app-confirmation-dialog__cancel-button"
    appButton
    colorType="secondary"
    (click)="cancel()"
  >
    Cancel
  </button>

  <button
    type="button"
    class="app-confirmation-dialog__confirm-button"
    appButton
    [colorType]="confirmColorType()"
    (click)="confirm()"
  >
    {{ data().confirmLabel }}
  </button>
</div>
