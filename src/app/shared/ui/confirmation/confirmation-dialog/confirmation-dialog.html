<p class="app-confirmation-dialog__question">
  {{ data().confirmLabel }} <b class="app-confirmation-dialog__subject">{{ data().subject }}</b>? {{
  data().message }}
</p>

<div class="app-confirmation-dialog__actions">
  <button
    type="button"
    class="app-confirmation-dialog__cancel-button"
    appButton
    colorType="secondary"
    (click)="cancel()"
  >
    Cancel
  </button>

  <button
    type="button"
    class="app-confirmation-dialog__confirm-button"
    appButton
    [colorType]="data().isDangerous ? 'danger' : 'primary'"
    (click)="confirm()"
  >
    {{ data().confirmLabel }}
  </button>
</div>
