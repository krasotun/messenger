<app-form
  [form]="changePasswordForm"
  [fields]="fields"
  submitLabel="Save"
  [isSubmitting]="isSubmitting()"
  (submitted)="onSubmit()"
>
  <app-form-field
    class="change-password-form__repeat-field"
    [label]="'Repeat new password'"
    [field]="changePasswordForm.repeatNewPassword"
  >
    <input [formField]="changePasswordForm.repeatNewPassword" appInput type="password" />
  </app-form-field>
</app-form>
