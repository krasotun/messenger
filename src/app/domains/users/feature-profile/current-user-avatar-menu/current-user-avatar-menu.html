@if(currentUserAvatarView(); as currentUserAvatarView) {
<button class="current-user-avatar-menu__trigger" type="button" (click)="menu.toggle($event)">
  <app-avatar
    [label]="currentUserAvatarView.label"
    [imageUrl]="currentUserAvatarView.imageUrl"
    [name]="currentUserAvatarView.name"
  ></app-avatar>
</button>

<p-menu #menu [model]="menuItems" [popup]="true" appendTo="body"></p-menu>
}
