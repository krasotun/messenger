@if (errorMessage(); as errorMessage) {
<div class="selected-chat-header__error">
  <div class="selected-chat-header__error-title">Failed to load chat</div>
  <div class="selected-chat-header__error-reason">{{ errorMessage }}</div>
</div>
} @else {
<app-avatar
  [label]="avatarLabel()"
  [imageUrl]="chat()?.avatar ?? null"
  [fallbackText]="avatarFallbackText()"
></app-avatar>

<div class="selected-chat-header__title">{{ chat()?.title }}</div>

<!-- PROTOTYPE: стек аватаров открывает состав по выбранному варианту -->
<button
  class="selected-chat-header__members"
  type="button"
  [attr.aria-label]="'Members: ' + prototypeMembers.members().length"
  (click)="openMembers()"
>
  <app-chat-user-stack [users]="prototypeMembers.members()"></app-chat-user-stack>
</button>

<button
  class="selected-chat-header__add-user"
  type="button"
  appButton
  colorType="secondary"
  [appPopover]="addUserPopover"
>
  + Add member
</button>

@if (canDeleteChat()) {
<button
  class="selected-chat-header__delete-button"
  type="button"
  appButton
  colorType="secondary"
  aria-label="Delete chat"
  (click)="deleteChat()"
>
  <!-- TODO(#49): заменить глиф на иконку, когда появится примитив иконок -->
  🗑
</button>
}

<ng-template #addUserPopover>
  <app-add-chat-user-panel
    [chatId]="numericChatId()"
    (userAdded)="closeAddUserPopover()"
  ></app-add-chat-user-panel>
</ng-template>

@if (membersOpen()) {
<div
  class="selected-chat-header__prototype-surface"
  [class.selected-chat-header__prototype-surface_wide]="currentVariant() === 'C'"
  [style.height.px]="membersHeight()"
>
  @if (currentVariant() === 'B') {
  <app-variant-b-side-panel
    [state]="prototypeMembers"
    [chatTitle]="chat()?.title ?? ''"
    (closed)="membersOpen.set(false)"
  ></app-variant-b-side-panel>
  } @else {
  <app-variant-c-members-view
    [state]="prototypeMembers"
    [chatTitle]="chat()?.title ?? ''"
    (closed)="membersOpen.set(false)"
  ></app-variant-c-members-view>
  }
</div>
} }

<app-prototype-switcher
  [variants]="prototypeVariants"
  [current]="currentVariant()"
></app-prototype-switcher>
