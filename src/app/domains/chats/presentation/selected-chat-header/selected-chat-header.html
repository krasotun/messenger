<app-avatar [label]="avatarLabel()" [imageUrl]="chat().avatar" [name]="chat().title"></app-avatar>

<div class="selected-chat-header__title">{{ chat().title }}</div>

<app-chat-user-stack [users]="chatUsers()"></app-chat-user-stack>

<button
  class="selected-chat-header__add-user"
  type="button"
  appButton
  colorType="secondary"
  [appPopover]="addUserPopover"
>
  + Add member
</button>

@if (isChatCreator()) {
<button
  class="selected-chat-header__delete-button"
  type="button"
  appButton
  colorType="secondary"
  aria-label="Delete chat"
  (click)="deleteRequested.emit()"
>
  <!-- TODO(#49): заменить глиф на иконку, когда появится примитив иконок -->
  🗑
</button>
}

<ng-template #addUserPopover>
  <app-add-chat-user-panel
    [chatId]="chat().id"
    (userAdded)="closeAddUserPopover()"
  ></app-add-chat-user-panel>
</ng-template>
