<form class="create-chat-form" [formGroup]="createChatForm" (ngSubmit)="onSubmit()">
  <app-form-field [label]="'Title'" [control]="createChatForm.controls.title">
    <input [formControl]="createChatForm.controls.title" appInput type="text" />
  </app-form-field>

  <div class="create-chat-form__actions">
    <button appButton [disabled]="isSubmitting() || !canSubmit()" type="submit">Create</button>
  </div>
</form>
