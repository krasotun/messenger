@let chatUser = user();

<app-avatar
  [label]="avatarLabel()"
  [imageUrl]="chatUser.avatar"
  [name]="chatUser.name"
  size="sm"
></app-avatar>

<div class="chat-user-row__label">
  <span class="chat-user-row__name">{{ chatUser.name }}</span>

  @if (isCurrentUser()) {
  <span class="chat-user-row__you">(you)</span>
  }
</div>
