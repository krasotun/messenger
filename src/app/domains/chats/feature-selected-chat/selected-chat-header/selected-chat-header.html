<app-avatar [label]="avatarLabel()" [imageUrl]="chat().avatar" [name]="chat().title"></app-avatar>

<div class="selected-chat-header__title">{{ chat().title }}</div>
<button
  class="selected-chat-header__members-button"
  type="button"
  pButton
  [text]="true"
  severity="secondary"
  aria-label="Members"
  (click)="membersToggled.emit()"
>
  <app-chat-user-stack [users]="chatUsers()"></app-chat-user-stack>
</button>

<button
  class="selected-chat-header__add-user-button"
  type="button"
  pButton
  severity="secondary"
  (click)="addUserPopover.toggle($event)"
>
  + Add member
</button>

@if (isChatCreator()) {
<button
  class="selected-chat-header__delete-button"
  type="button"
  pButton
  severity="secondary"
  [outlined]="true"
  aria-label="Delete chat"
  (click)="deleteRequested.emit()"
>
  <i class="pi pi-trash" aria-hidden="true"></i>
</button>
}

<p-popover #addUserPopover appendTo="body">
  <ng-template #content>
    <app-add-chat-user-panel
      [chatId]="chat().id"
      (userAdded)="addUserPopover.hide()"
    ></app-add-chat-user-panel>
  </ng-template>
</p-popover>
