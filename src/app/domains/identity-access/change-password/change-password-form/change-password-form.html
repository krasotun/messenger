<app-form
  [group]="changePasswordForm"
  submitLabel="Save"
  [isSubmitting]="isSubmitting()"
  (submitted)="onSubmit()"
>
  @for (field of fields; track field.label) {
  <app-form-field [label]="field.label" [control]="field.control">
    <input [formControl]="field.control" appInput [type]="field.type" />
  </app-form-field>
  }

  <app-form-field
    class="change-password-form__repeat-field"
    [label]="'Repeat new password'"
    [control]="changePasswordForm.controls.repeatNewPassword"
  >
    <input [formControl]="changePasswordForm.controls.repeatNewPassword" appInput type="password" />
  </app-form-field>
</app-form>
