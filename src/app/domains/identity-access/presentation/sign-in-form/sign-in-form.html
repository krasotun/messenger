<form class="sign-in-form" [formGroup]="signInForm" (ngSubmit)="onSubmit()">
  <div class="sign-in-form__fields">
    <app-form-field [label]="'Login'" [htmlFor]="'login'" [error]="getControlError('login')">
      <input formControlName="login" appInput type="text" id="login" />
    </app-form-field>
    <app-form-field
      [label]="'Password'"
      [htmlFor]="'password'"
      [error]="getControlError('password')"
    >
      <input formControlName="password" appInput type="password" id="password" />
    </app-form-field>
  </div>

  <div class="sign-in-form__actions">
    <button appButton [disabled]="isSubmitting() || !canSubmit()" type="submit">Log in</button>
  </div>
</form>
