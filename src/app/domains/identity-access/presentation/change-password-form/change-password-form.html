<form class="change-password-form" [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()">
  <div class="change-password-form__fields">
    <app-form-field
      [label]="'Old password'"
      [htmlFor]="'oldPassword'"
      [error]="getControlError('oldPassword')"
    >
      <input
        formControlName="oldPassword"
        appInput
        [invalid]="hasControlError('oldPassword')"
        type="password"
        id="oldPassword"
      />
    </app-form-field>

    <app-form-field
      [label]="'New password'"
      [htmlFor]="'newPassword'"
      [error]="getControlError('newPassword')"
    >
      <input
        formControlName="newPassword"
        appInput
        [invalid]="hasControlError('newPassword')"
        type="password"
        id="newPassword"
      />
    </app-form-field>

    <app-form-field
      class="change-password-form__repeat-field"
      [label]="'Repeat new password'"
      [htmlFor]="'repeatNewPassword'"
      [error]="getControlError('repeatNewPassword')"
    >
      <input
        formControlName="repeatNewPassword"
        appInput
        [invalid]="hasControlError('repeatNewPassword')"
        type="password"
        id="repeatNewPassword"
      />
    </app-form-field>
  </div>

  @if (errorMessage()) {
  <span class="change-password-form__error">Ошибка смены пароля: {{ errorMessage() }}</span>
  }
  <div class="change-password-form__actions">
    <button appButton [disabled]="isSubmitting()" type="submit">Save</button>
  </div>
</form>
