<form class="change-password-form" [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()">
  <div class="change-password-form__fields">
    <app-form-field [label]="'Old password'" [control]="changePasswordForm.controls.oldPassword">
      <input [formControl]="changePasswordForm.controls.oldPassword" appInput type="password" />
    </app-form-field>

    <app-form-field [label]="'New password'" [control]="changePasswordForm.controls.newPassword">
      <input [formControl]="changePasswordForm.controls.newPassword" appInput type="password" />
    </app-form-field>

    <app-form-field
      class="change-password-form__repeat-field"
      [label]="'Repeat new password'"
      [control]="changePasswordForm.controls.repeatNewPassword"
    >
      <input
        [formControl]="changePasswordForm.controls.repeatNewPassword"
        appInput
        type="password"
      />
    </app-form-field>
  </div>

  <div class="change-password-form__actions">
    <button appButton [disabled]="isSubmitting() || !canSubmit()" type="submit">Save</button>
  </div>
</form>
