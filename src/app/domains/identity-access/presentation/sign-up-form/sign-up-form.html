<form class="sign-up-form" [formGroup]="signUpForm" (ngSubmit)="onSubmit()">
  <div class="sign-up-form__fields">
    <app-form-field
      [label]="'First name'"
      [htmlFor]="'firstName'"
      [error]="getControlError('firstName')"
    >
      <input formControlName="firstName" appInput type="text" id="firstName" />
    </app-form-field>

    <app-form-field
      [label]="'Second name'"
      [htmlFor]="'secondName'"
      [error]="getControlError('secondName')"
    >
      <input formControlName="secondName" appInput type="text" id="secondName" />
    </app-form-field>

    <app-form-field [label]="'Login'" [htmlFor]="'login'" [error]="getControlError('login')">
      <input formControlName="login" appInput type="text" id="login" />
    </app-form-field>

    <app-form-field [label]="'Email'" [htmlFor]="'email'" [error]="getControlError('email')">
      <input formControlName="email" appInput type="email" id="email" />
    </app-form-field>

    <app-form-field
      [label]="'Password'"
      [htmlFor]="'password'"
      [error]="getControlError('password')"
    >
      <input formControlName="password" appInput type="password" id="password" />
    </app-form-field>

    <app-form-field [label]="'Mobile phone'" [htmlFor]="'phone'" [error]="getControlError('phone')">
      <input formControlName="phone" appInput type="text" id="phone" />
    </app-form-field>
  </div>

  <div class="sign-up-form__actions">
    <button appButton [disabled]="isSubmitting() || !canSubmit()" type="submit">Register</button>
  </div>
</form>
