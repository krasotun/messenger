<form class="change-avatar-form" (submit)="onSubmit($event)">
  <div class="change-avatar-form__preview">
    <app-avatar
      [label]="'Avatar preview'"
      [imageUrl]="avatarUrl()"
      [size]="'lg'"
      [fallbackText]="'?'"
    ></app-avatar>
  </div>

  <label class="change-avatar-form__file-field">
    <span class="change-avatar-form__file-label">Avatar</span>
    <input
      class="change-avatar-form__file-input"
      type="file"
      [accept]="acceptedMimeTypes"
      [disabled]="isSubmitting()"
      (change)="onFileSelected($event)"
    />
  </label>

  @if (errorMessage()) {
  <span class="change-avatar-form__error">Ошибка смены аватара: {{ errorMessage() }}</span>
  }

  <div class="change-avatar-form__actions">
    <button appButton [disabled]="isSubmitting()" type="submit">Change avatar</button>
  </div>
</form>
