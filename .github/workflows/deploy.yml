name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22.16.0'

      - run: HUSKY=0 npm ci
      - run: npm run lint
      - run: npm run test:ci
      - run: npx playwright install --with-deps
      - run: npm run e2e
      - run: npm run build -- --base-href /messenger/

      - name: Add SPA fallback for GitHub Pages
        run: cp dist/messenger/browser/index.html dist/messenger/browser/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/messenger/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
